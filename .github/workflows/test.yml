name: CI

on:
  push:
    branches:
      - "*" 
  pull_request:
    branches:
      - '*'

jobs:
  test:
    strategy:
      fail-fast: true

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Run Forge build
        run: |
          forge --version
          forge build
        id: build

      - name: Run Forge tests
        run: |
          forge test
        env:
          MAINNET_RPC_URL: https://eth.llamarpc.com
        id: test
